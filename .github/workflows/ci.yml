name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System deps (openssl for native-tls)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (openssl for native-tls)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: cargo build (debug)
        run: cargo build --locked --all-targets
      - name: cargo test
        run: cargo test --locked

  # tools/heimdall-discord is its own crate on purpose (it must not be part of
  # the daemon), so the jobs above never touch it.
  tool-discord:
    name: tools/heimdall-discord
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/heimdall-discord
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/heimdall-discord
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  notify:
    name: discord
    needs: [lint, test, tool-discord]
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      # `github.event.head_commit` exists only on PUSH events. On a pull_request run
      # both halves of the old single-line template resolved to empty and Discord got
      # a literal "[]()"; on push it held the WHOLE commit message, whose newlines
      # break a [label](url) anyway. Build the line here instead, per event, and keep
      # it to one line.
      - name: Describe what was built
        id: what
        # Reached through the environment, never interpolated into the script text:
        # a commit message and a PR title are attacker-controlled on a fork PR.
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          branch="$GITHUB_REF_NAME"
          case "$EVENT" in
            push)
              text="[${COMMIT_MSG%%$'\n'*}]($COMMIT_URL)" ;;
            pull_request)
              # github.ref_name is "24/merge" on a PR run; the head branch is the
              # thing a human recognises.
              branch="$GITHUB_HEAD_REF"
              text="[#${PR_NUM}: ${PR_TITLE}]($PR_URL)" ;;
            *)
              text="[${GITHUB_SHA::7} on ${branch}]($SHA_URL)" ;;
          esac
          text="${text//$'\n'/ }"
          echo "description: $text"
          {
            printf 'text=%s\n' "$text"
            printf 'branch=%s\n' "$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Report build status
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ (needs.lint.result == 'success' && needs.test.result == 'success') && 'success' || 'failure' }}
          title: "[${{ github.event.repository.name }}] ${{ (needs.lint.result == 'success' && needs.test.result == 'success') && '✅' || '❌' }} CI - ${{ github.actor }} on ${{ steps.what.outputs.branch }}"
          description: ${{ steps.what.outputs.text }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
