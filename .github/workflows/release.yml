name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no leading v), e.g. 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  release:
    name: build + publish
    runs-on: ubuntu-latest
    # Build inside the same image deploy/build-linux.sh uses, so the release binary is
    # byte-for-byte the product of the same recipe (deploy/build-musl.sh).
    container: rust:alpine
    steps:
      # git must exist BEFORE checkout so we get real history + tags (build.rs reads them).
      # github-cli publishes the release from inside the container.
      - name: Install git + gh
        run: apk add --no-cache git github-cli

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static musl binary
        env:
          HEIMDALL_VERSION_OVERRIDE: ${{ inputs.version }}
          OUT_DIR: dist
        run: sh deploy/build-musl.sh

      - name: Checksum
        run: |
          cd dist
          sha256sum heimdall > heimdall.sha256
          cat heimdall.sha256

      - name: Report embedded version
        run: ./dist/heimdall --version

      # Wraps the artifact built above rather than rebuilding, so the binary in the
      # .deb and the loose binary on the release page are the same file.
      - name: Build Debian package
        env:
          BIN: dist/heimdall
          OUT_DIR: dist
          VERSION: ${{ inputs.version }}
          DEB_MAINTAINER: "Lantr <https://github.com/lantr-io/heimdall>"
        run: |
          apk add --no-cache dpkg
          sh deploy/debian/build-deb.sh
          # A separate checksum file: deploy.sh runs `shasum -c heimdall.sha256`
          # having downloaded only the bare binary, so an extra line in there
          # would make that verification fail on a missing file.
          cd dist && sha256sum ./*.deb > heimdall.deb.sha256 && cat heimdall.deb.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ inputs.version }}" \
            --notes "Static x86_64-linux (musl) build of heimdall, from ${{ github.sha }}. Ships as a bare binary and as a Debian package (installs disabled; see deploy/README.md)." \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            dist/heimdall dist/heimdall.sha256 dist/*.deb dist/heimdall.deb.sha256

  image:
    name: ghcr image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build the image from the binary the release job already PUBLISHED, not
      # from a fresh compile. That is what stops the three artifacts drifting: the
      # image, the .deb and the release asset are then provably one file, and the
      # checksum below is the proof. It is a separate job because the release job
      # runs inside rust:alpine, which has no docker daemon.
      - name: Download the published binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy/out
          gh release download "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern heimdall --pattern heimdall.sha256 \
            --dir deploy/out
          cd deploy/out && sha256sum -c heimdall.sha256 && chmod +x heimdall

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build \
            --build-arg BIN=deploy/out/heimdall \
            --build-arg "VERSION=$VERSION" \
            -f deploy/docker/Dockerfile \
            -t "$IMAGE:$VERSION" \
            .
          docker run --rm "$IMAGE:$VERSION" --version
          docker push "$IMAGE:$VERSION"
          # A prerelease must not move `latest`: `docker pull heimdall` is what an
          # operator following the guide types, and it has to land on a release.
          if [ "$PRERELEASE" != "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  notify:
    name: discord
    needs: [release, image]
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Report release status
        if: env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ (needs.release.result == 'success' && needs.image.result == 'success') && 'success' || 'failure' }}
          title: "[${{ github.event.repository.name }}] ${{ (needs.release.result == 'success' && needs.image.result == 'success') && '🚀' || '❌' }} Release v${{ inputs.version }} - ${{ github.actor }}"
          description: "${{ (needs.release.result == 'success' && needs.image.result == 'success') && format('Published [v{0}]({1}/{2}/releases/tag/v{0})', inputs.version, github.server_url, github.repository) || 'Release build failed' }}"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nodetail: true
          notimestamp: true
