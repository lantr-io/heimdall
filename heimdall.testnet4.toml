# Heimdall config for testnet4 (depositor tool / SPO daemon).
# Only fields that differ from the compiled-in defaults are set here —
# every field has a serde default (see src/config.rs).

[protocol]
# Required: the daemon refuses to start without it — it holds the DKG share that
# survives a restart and the completed-peg-outs trie, and an empty trie re-pays a
# peg-out that was already paid.
state_dir = ".state/testnet4"

[bitcoin]
network = "testnet4"

# RPC endpoint of the binocular-managed bitcoind (../binocular/bitcoind-testnet4.sh).
rpc_url = "http://127.0.0.1:48332"
rpc_user = "bitcoin"
rpc_pass = "bitcoin"

# Depositor refund timelock (BTC blocks). Spec default 4320 (~30 days);
# demo simplification uses 720 (~5 days). Must match the SPO daemons.
# OPTIONAL since [CFG-9]: the bridge publishes this as Config params[8], and a node that
# leaves it unset reads the published value. Set here it is a CROSS-CHECK, and a disagreement
# with the Config is fatal — the delay is hashed into every deposit address, so two SPOs on
# different values reconstruct different ones. Must exceed federation_csv_blocks.
pegin_refund_timeout_blocks = 720

# 32-byte hex seed for the deterministic demo federation key (Y_fed), and the CSV
# delay of the federation leaf. Must match what every SPO daemon uses, or your
# peg-in P2TR address won't be redeemable by the federation.
#
# A real SPO sets NEITHER (WI-069): both are published in the bridge's
# treasury_info datum, which heimdall reaches from the Config NFT. This demo has
# no such datum, so both are spelled out — and there is no default for either,
# precisely because a guess derives a well-formed address holding nothing.
y_fed_seed_hex = "fefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefe"
federation_csv_blocks = 144

# Broadcast signed BTC tx automatically. Leave false for first-run dry
# runs (depositor prints raw hex either way); flip to true once you've
# verified the tx looks right.

# No local treasury UTXO fields: the anchor outpoint lives on-chain in
# the bridge Config UTxO (field 11) and the current treasury is resolved
# by walking the Confirmed Treasury Movement chain — set the [cardano]
# config_address / config_nft_* fields for the SPO daemon.
