# Heimdall configuration — the local DEMO/development node.
#
# For a real deployment start from deploy/debian/heimdall.toml, which is the
# packaged conffile and documents every key an SPO sets. This file exists to run
# the fixture demo against preprod, so it carries a few values a production node
# would read from the chain instead.
#
# Keys with nothing but their compiled default are omitted: a line that restates
# the default is one more thing to keep in step with the code, and it silently
# stops matching the day the default moves.

[protocol]
# Durable directory for this node's completed-peg-outs trie mirror (cpo-trie.json),
# and for the DKG share that survives a restart. Unset means the EMPTY (genesis)
# trie on every start — correct only on a bridge that has completed no peg-out.
# Set it before paying peg-outs, and rebuild after a re-bootstrap with
# `reconstruct-cpo-trie`. BuildTm cross-checks the loaded root against the cpo_root
# in the on-chain bridge state singleton (Config #4) and refuses to
# sign on a mismatch.
# state_dir = "/var/lib/heimdall"

[bitcoin]
network = "testnet4"
federation_csv_blocks = 144
# Depositor refund timelock in BTC blocks (peg-in Taproot refund leaf).
# Production spec is 4320 (~30 days); demo simplification uses 720 (~5 days).
# OPTIONAL since [CFG-9]: the bridge publishes this as Config params[8], and a node that
# leaves it unset reads the published value. Set here it is a CROSS-CHECK, and a disagreement
# with the Config is fatal — the delay is hashed into every deposit address, so two SPOs on
# different values reconstruct different ones. Must exceed federation_csv_blocks.
pegin_refund_timeout_blocks = 720
# 32-byte hex seed of the demo's single-key federation. A real bridge's
# federation key is generated by its members together (`heimdall federation-dkg`)
# and published at Config #11, so a node reads it from the chain and holds only a
# SHARE of it — see docs/operator-guide.md, "Forming the initial federation".
y_fed_seed_hex = "fefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefe"
# Read by the `depositor` demo tool ALONE, which needs the UTxO set to choose
# funding inputs. heimdall itself never reads or writes Bitcoin (WI-086): it
# posts signed movements to Cardano and a watchtower relays them. An SPO leaves
# these unset.
rpc_url = "http://127.0.0.1:48332"   # testnet4 RPC (bitcoind -testnet4)
rpc_user = "bitcoin"
rpc_pass = "bitcoin"

[cardano]
# Kupo base URL. OPTIONAL, and used ONLY by `reconstruct-cpo-trie`, which rebuilds the
# completed-peg-outs trie from the inline datums of already-SPENT outputs — a read
# a Blockfrost-compatible UTxO API cannot serve. Steady-state operation never uses it.
#
# Set    -> reconstruction reads Kupo. Recommended for production SPOs: one request
#           per address, and self-hosted, as the spec requires of consensus-relevant reads.
# Unset  -> reconstruction falls back to the Blockfrost-compatible transaction-history
#           endpoints (blockfrost_project_id below). Same trie, same checks, but it walks
#           the whole address history — roughly one request per transaction. Meant for
#           test environments, demos, and non-SPO tooling.
# kupo_url = "http://localhost:1442"
# UNSET, so this file runs the OFFLINE fixture demo out of the box — no
# credentials, no chain. Setting it puts the node on the live-chain route, which
# needs the three config_* values below as well: since WI-070 every bridge
# identifier comes from the Config UTxO, so there is no longer a half-way state
# where a node reads a real chain with hand-typed addresses.
# blockfrost_project_id = "preprod..."
# socket_path = "/run/cardano-node/node.socket"
# network_magic = 1
# mnemonic is loaded from $HEIMDALL_MNEMONIC (see .env, gitignored).
# Setting mnemonic here would override the env var.
submit_oracle = true   # publish oracle-update UTxO to Cardano after signing
# Bridge Config UTxO locator — the discovery root. Everything about the bridge is
# read from the UTxO these three identify: the peg-in/peg-out addresses, the
# bridged-token unit, the TM validator, the bridge-state singleton (whose head is
# the current treasury outpoint), the registry and ban identities, and the
# operational parameters. Values from `binocular deploy-bridge`.
# config_address = "addr_test1..."                    # the config script address
# config_nft_policy_id = "<config NFT policy, 56 hex>"
# config_nft_asset_name = "424946434647"              # "BIFCFG" hex
# REQUIRED for posting a TM: the TreasuryMovementValidator CBOR (from `binocular tm-script`),
# alongside the config_* fields above. Its hash must equal the published Config #5.
# Minting is permissionless: the redeemer names the bridge-state singleton reference
# input, and the validator checks the posted TM spends the singleton's head.
# tm_script_cbor = "<cbor from `binocular tm-script`>"

[http]
# bind_address is the local interface; 0.0.0.0 by default, because peers must
# reach this endpoint. Narrow it when something in front should. The PORT comes from the
# bifrost_url this node registered on-chain; set listen_port only when the local
# port must differ from the advertised one (a reverse proxy, a container port
# map). base_port lives under [demo] — it only feeds the local fixture roster.
bind_address = "0.0.0.0"
#listen_port = 18500

# [demo] takes its defaults (2-of-3 from port 18500). `heimdall demo` overrides
# them with --min-signers / --max-signers / --base-port.

[log]
# A bare level is scoped to heimdall's own modules and leaves the dependency
# tree at `warn`, so `debug` does not bury the node under reqwest/hyper chatter.
# Anything containing `=` or `,` is used verbatim as a RUST_LOG directive, e.g.
# "warn,heimdall::cardano::blockfrost_chain=debug".
level = "info"
# auto | plain | journal | json.
#   auto    — `journal` when systemd is capturing stdout (JOURNAL_STREAM is set),
#             else `plain`. There is no reason to set this by hand under systemd.
#   journal — `<N>`-prefixed lines so journald files each event at its real
#             priority and `journalctl -p err` shows errors and nothing else.
#   json    — one object per event, for a log shipper.
format = "auto"
# Both are overridden by --log-level / --log-format, and by the RUST_LOG /
# HEIMDALL_LOG_FORMAT environment variables — so verbosity on a running node
# changes without editing this file or rebuilding.
