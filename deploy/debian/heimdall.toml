# /etc/heimdall/heimdall.toml — heimdall SPO daemon configuration.
#
# Installed 0640 root:heimdall and tracked by dpkg as a conffile: your edits
# survive package upgrades, and a changed shipped default is offered as a merge
# rather than applied silently.
#
# Everything that identifies THIS BRIDGE is commented out below, because there is
# no sane default for it — the values come from whoever deployed the bridge you
# are joining. The daemon exits with a message naming the missing key rather than
# guessing, so uncomment as you go.
#
# SECRETS: keep the wallet mnemonic OUT of this file and in
# /etc/default/heimdall as $HEIMDALL_MNEMONIC (see cardano.mnemonic below).
#
# After editing:  heimdall run-mover --config /etc/heimdall/heimdall.toml --once
# to watch one dry-run tick, then `systemctl enable --now heimdall`.


[protocol]
# REQUIRED IN ANY REAL DEPLOYMENT. Holds the per-epoch DKG signing share (0600)
# so it survives a restart, and the completed-peg-outs trie (cpo-trie.json).
# Left unset the trie is rebuilt EMPTY on every start, which is correct only on a
# bridge that has never completed a peg-out — on any other, the daemon would
# treat already-paid peg-outs as unpaid. The package creates this directory 0700.
state_dir = "/var/lib/heimdall"

# Poll cadence for the chain-watching loops (ms).
poll_interval_ms = 5000

# There is no peg-out freshness margin to set here. A peg-out is payable only
# while at least 7 days from its 30-day cancel deadline — a TM SELECTION rule, so
# it decides the TM bytes, so a divergent one makes the FROST round fail to
# converge with nothing in any log naming the cause. It was a key on this line
# until WI-071, with a comment telling you not to change it; it is now compiled in
# (PEG_OUT_FRESHNESS_MARGIN_MS), and a config still setting it is refused.


[bitcoin]
# The Bitcoin network this bridge settles on: "mainnet", "testnet4", "signet",
# "regtest". Must match the bridge you are joining.
#network = "testnet4"

# Federation identity — LEAVE BOTH UNSET on a bridge with an on-chain registry.
#
# They feed the treasury address every SPO must derive identically, so they used
# to be copied from the bridge's deployment notes into every operator's config,
# with a wrong value producing no error at all — just a well-formed address nobody
# else uses. They are published in the bridge's treasury_info datum, which
# heimdall finds from the Config NFT alone, and startup check 8 prints which
# source it used.
#
# Set them ONLY for a deployment with no readable treasury_info (the fixture-roster
# demo). There they are mandatory: heimdall refuses to start without them, because
# an input to the treasury address has no safe default.
#
# y_fed_seed_hex is a SPENDING SECRET, not an identifier: it signs the treasury's
# federation recovery path, which is why the chain carries only the derived public
# key. Set it only on a node that performs federation spends — there it also
# cross-checks the published key, the one check a node without the seed cannot
# make, and a disagreement is fatal rather than silently resolved.
#
# Leaving these commented out is the normal case. Setting either to "" counts as
# unset, not as an empty value.
#y_fed_seed_hex = ""
#federation_csv_blocks = 144

# NO BITCOIN NODE IS REQUIRED. heimdall posts Treasury Movements to Cardano and
# the watchtowers relay them to Bitcoin. Leave `submit` false and rpc_url unset:
# a second broadcaster is not redundancy here, it is a way to publish a movement
# the Cardano side has not recorded.
submit = false
#rpc_url = "http://127.0.0.1:8332"
#rpc_user = ""
#rpc_pass = ""


[cardano]
# ── Operator identity — these are about YOU, not the bridge ──────────────────

# Blockfrost project id for the network above. Required: it is how the daemon
# reads Cardano.
#blockfrost_project_id = ""

# Self-hosted Blockfrost-compatible endpoint — a Dolos in front of your own
# cardano-node, which is the shape an SPO should prefer: heimdall -> Dolos ->
# your node, with no third party between you and the chain. Covers reads and
# transaction submission alike. Leave unset for hosted Blockfrost.
#blockfrost_url = "http://localhost:3000/api/v0"

# Which Cardano network this node is on: mainnet | preprod | preview | testnet.
#
# REQUIRED once blockfrost_url is set, and the daemon refuses to start without
# it. Hosted Blockfrost encodes the network in the project id, so it can be
# inferred there; a local backend has no such prefix, and guessing "testnet" on
# a mainnet machine would derive every script address with the wrong bech32
# prefix and let the fault-proof safety gate fail open.
#network = "mainnet"

# Cardano wallet mnemonic — the wallet that pays fees and holds this SPO's
# registration deposit.
#
# PREFER /etc/default/heimdall: heimdall falls back to $HEIMDALL_MNEMONIC only
# when this key is absent, so uncommenting it here DISABLES the environment
# variable. Left commented, the seed never enters a dpkg-tracked file.
#mnemonic = ""

# Where the treasury movement is posted. Keep true: posting to the Cardano oracle
# is how a movement reaches the watchtowers. 0 = post as Unconfirmed (a watchtower
# marks it Confirmed later, after Bitcoin confirmations and oracle aging).
submit_oracle = true
oracle_constructor = 0

# How this node learns each pool's active stake for the stake-weighted DKG.
stake_source = "blockfrost"

# ── The bridge — copy from the bridge's deployment notes ─────────────────────
#
# The Config UTxO is the discovery root: the daemon derives the config address
# from the policy id, finds the single UTxO holding that token, and reads the
# operational parameters (fee rate, batch schedule, selection floors) from its
# datum. Without all three of these the daemon cannot see the batch grid and
# falls back to a wall-clock cadence, which does NOT agree with the other SPOs.
#config_address = ""
#config_nft_policy_id = ""
#config_nft_asset_name = ""

# NOTHING ELSE ABOUT THE BRIDGE BELONGS IN THIS FILE.
#
# The peg-in and peg-out script addresses, the bridged-token unit, the TM
# validator address and its state token, the bridge-state policy, the SPO
# registry's identity, its treasury_info state NFT and the ban policy and its
# schedule are all published in that Config datum, and heimdall derives every one
# of them from it. They used to be keys here, copied out of a deployment note per
# operator. A wrong value never produced an error — it produced a well-formed
# address holding nothing, which reads as "no peg-ins pending", "no peg-outs
# pending" and "nobody is banned" while the node keeps signing.
#
# heimdall REFUSES to start if any of them is still present, and names the Config
# field that replaced it. `heimdall show-config-params` prints what it resolved
# from the chain, and startup step 3 lists every contract address it derived.

# The treasury movement validator (PlutusV3 CBOR hex). REQUIRED only to POST a
# treasury movement: minting the TM NFT needs the compiled script, which the
# Config publishes the hash of (#4) but not the code. A node that only signs
# does not need it.
#tm_script_cbor = ""

# The compiled contracts (plutus.json), for the ONE thing the published identity
# cannot buy: spending the treasury_info state UTxO, i.e. the Update-Y key
# handoff after a DKG. Reading the roster never needs it. A build artifact of the
# contracts release, not a per-bridge value — and what it derives is checked
# against the Config's #12, so a blueprint from the wrong release is refused
# rather than used. Startup step 7 says which of the two you are; without it this
# node still runs DKG and signs, it just cannot be the one that rotates the key.
#registry_blueprint = "/var/lib/heimdall/plutus.json"

# Fault ENFORCEMENT — publishing a fault proof on chain so misbehaviour costs
# something. Entirely OPTIONAL and off by default: faults are detected and the
# offender excluded from the ceremony either way, with or without these, and the
# ban list heimdall FILTERS the roster against comes from Config #7 and needs
# none of them. What these buy is the ability to build an ApplyBan under that
# same policy, which means re-deriving it — so each value must match the
# deployment exactly, being an input to the policy's own identifier.
#
# All of them or none. Setting one and omitting another is a startup error
# rather than a half-working publish path.
#
# Do not enable on mainnet yet — the deployed round1/round2 verifiers are
# generated from a test setup and heimdall will refuse to start. See
# docs/fault-proof-srs.md in the heimdall repository.
#registry_bootstrap = "<tx_hash>:<index>"
#ban_bootstrap = "<tx_hash>:<index>"
#fault_proof_policies = ["<28-byte hex>", "<28-byte hex>", "<28-byte hex>"]
#spo_bans_ref = "<tx_hash>:<index>"
#fault_verifier_round1_ref = "<tx_hash>:<index>"
#fault_verifier_round2_ref = "<tx_hash>:<index>"
#fault_verifier_equivocation_ref = "<tx_hash>:<index>"
#fault_proof_srs_path = "/var/lib/heimdall/kzg_params_22"


[http]
# THE SPO-TO-SPO PROTOCOL SURFACE, and the one piece of networking that must be
# right. Peers FETCH this node's DKG and signing rounds from the `bifrost_url` it
# registered on-chain. A peer that cannot reach it cannot get this node's round-1
# payload, so the node drops out of the qualified set and contributes nothing to
# the epoch — silently, from this node's point of view.
#
# bind_address is the LOCAL INTERFACE to bind. 0.0.0.0 (every interface) is the
# default because this endpoint has to be reachable; narrow it to a specific NIC,
# or to 127.0.0.1 when a reverse proxy in front is the only thing that should
# reach it. Do NOT use loopback on a directly-exposed node — inside a container
# it is unreachable even with -p.
#
# THE ADVERTISED ADDRESS IS NOT SET HERE — it is the bifrost_url you registered
# on-chain, and peers fetch from that. Left alone, this node also LISTENS on the
# port inside that URL, which is right when it is exposed directly.
#
# Set listen_port when the local port must differ from the public one — a reverse
# proxy owning :443, a container port mapping, anything in front. The advertised
# URL stays whatever you registered; only where this process listens changes. It
# also lifts the explicit-:<port> requirement on the URL, so you can register a
# clean https://spo.example.com and terminate TLS at nginx.
bind_address = "0.0.0.0"
#listen_port = 18500


[bifrost]
# This SPO's long-lived secp256k1 bifrost identity secret key: a 0600 file holding
# 32 bytes as hex. It is bound on-chain at registration, and the daemon signs every
# published DKG and signing payload with it — losing it means re-registering,
# leaking it means someone else can sign as you. Keep it inside state_dir, owned
# by the heimdall user, and back it up somewhere the daemon cannot reach.
#skey_path = "/var/lib/heimdall/bifrost.skey"


[log]
# Verbosity. A bare level — error / warn / info / debug / trace — applies to
# heimdall's own modules and leaves its dependencies at "warn", so `debug` shows
# you the daemon rather than reqwest's TLS handshakes. Anything containing "=" or
# "," is used verbatim as a RUST_LOG directive, e.g.
# "warn,heimdall::cardano::blockfrost_chain=debug" to follow one subsystem.
#
# You rarely need to edit this file to change it: RUST_LOG in
# /etc/default/heimdall overrides it and survives package upgrades.
level = "info"

# auto | plain | journal | json. LEAVE THIS ALONE under systemd.
#
# "auto" detects that journald is capturing stdout and switches to "journal",
# which prefixes each line with the syslog priority systemd strips. That is what
# makes `journalctl -u heimdall -p err` show errors and nothing else — without
# it systemd files EVERY line at priority 6 (info), including the errors, and a
# broken node looks silent. Set "json" only if a log shipper is reading this.
format = "auto"
